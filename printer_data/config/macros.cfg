[gcode_macro M106]
rename_existing: M106.1
gcode:
    # 1. Geschwindigkeit berechnen (S-Wert von 0-255 in 0.0-1.0 umwandeln, Standard: voll an)
    {% set speed = (params.S|float / 255.0 if params.S is defined else 1.0) %}
    
    # 2. Lüfter-Index auslesen (P-Wert, Standard: 0 für den Haupt-Bauteillüfter)
    {% set fan_index = (params.P|int if params.P is defined else 0) %}

    # 3. Logik zur Zuweisung der Lüfter
    {% if fan_index == 0 %}
        # P0 oder kein P steuert den Standard-Klipper-Lüfter auf dem SHT36
        M106.1 S{speed * 255}
    {% elif fan_index == 2 %}
        # P2 steuert den Auxiliary Blower auf dem Mainboard
        SET_FAN_SPEED FAN=fan2 SPEED={speed}
    {% elif fan_index == 3 %}
        # P3 steuert den Fume Pack Auspufflüfter auf dem Mainboard
        SET_FAN_SPEED FAN=fan3 SPEED={speed}
    {% else %}
        # Sicherheitsnetz: Wenn ein unbekanntes P aufgerufen wird
        {action_respond_info("M106: Unbekannter Luefter-Index P" ~ fan_index)}
    {% endif %}

    ################################################################

[gcode_macro _LDC_CALIBRATE_DRIVE_CURRENT]
gcode:
    BED_MESH_CLEAR
    SET_KINEMATIC_POSITION x=100 y=100 z=10
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    G0 Z30 F600
    G4 P1000
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=fly_eddy_probe 
    G4 P1000
    SAVE_CONFIG

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
    BED_MESH_CLEAR
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G90 # Abs positioning
    G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 } # Allows the user to work it down until it touches.
    {% endif %}
    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

